name: CI

# Versions pinned deliberately (not "latest") so GitHub rotating its macOS
# image can't silently flip this red or change what gets tested. Bump these
# on purpose when adopting a new Xcode release; check what's available on
# the `macos-26` runner first:
# https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md

on:
  pull_request:

env:
  XCODE_VERSION: "26.5"
  SIMULATOR_DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=26.5"
  DERIVED_DATA_PATH: DerivedData

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  # Builds SubTimerTests + SubTimerUITests exactly once (instead of every
  # `test` shard below rebuilding from scratch) and hands the built products
  # + generated .xctestrun to them as an artifact. See #72: the previous
  # single "Unit + UI tests" job took ~12m28s, with UI tests alone
  # accounting for ~518s/~69% of that, serially, on one VM.
  build-for-testing:
    name: Build for testing
    runs-on: macos-26
    outputs:
      xctestrun: ${{ steps.locate-xctestrun.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('SubTimer.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Warm up CoreSimulator for the selected Xcode
        # Switching to a non-default Xcode via setup-xcode can leave
        # xcodebuild's destination resolver blind to that Xcode's pre-baked
        # simulator devices until CoreSimulator has been queried under it at
        # least once. Cheap, and avoids a flaky "Unable to find a device
        # matching the provided destination specifier" on a cold runner.
        run: xcrun simctl list devices available

      - name: Build for testing (SubTimerTests + SubTimerUITests)
        run: |
          xcodebuild build-for-testing \
            -project SubTimer.xcodeproj \
            -scheme SubTimer \
            -testPlan SubTimerCI \
            -destination "${{ env.SIMULATOR_DESTINATION }}" \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}"

      - name: Locate the generated .xctestrun
        id: locate-xctestrun
        run: |
          xctestrun_path=$(find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -maxdepth 1 -name '*.xctestrun')
          if [ -z "$xctestrun_path" ]; then
            echo "::error::No .xctestrun file found under Build/Products" >&2
            exit 1
          fi
          echo "name=$(basename "$xctestrun_path")" >> "$GITHUB_OUTPUT"

      - name: Package built products for the test shards
        # actions/upload-artifact's own zip/unzip roundtrip is a known
        # footgun for the symlinks Xcode leaves inside .app/.xctest bundles
        # on macOS runners; tarring first (tar preserves symlinks) and
        # uploading the tarball as a single file avoids that.
        run: tar -czf build-products.tar.gz -C "${{ env.DERIVED_DATA_PATH }}/Build/Products" .

      - name: Upload built products
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: build-products.tar.gz
          retention-days: 1

  test:
    name: Test / ${{ matrix.shard }}
    needs: build-for-testing
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit
            only_testing: "SubTimerTests"
            parallel: false
          - shard: ui-player-launch
            only_testing: >-
              SubTimerUITests/PlayerComponentsUITests
              SubTimerUITests/SubTimerUITests
              SubTimerUITests/SubTimerUITestsLaunchTests
            parallel: true
          - shard: ui-settings
            only_testing: "SubTimerUITests/SettingsViewUITests"
            parallel: true
          - shard: ui-timer
            only_testing: "SubTimerUITests/TimerViewUITests"
            parallel: true
    steps:
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Warm up CoreSimulator for the selected Xcode
        run: xcrun simctl list devices available

      - name: Download built products
        uses: actions/download-artifact@v4
        with:
          name: build-products

      - name: Unpack built products
        run: |
          mkdir -p "${{ env.DERIVED_DATA_PATH }}/Build/Products"
          tar -xzf build-products.tar.gz -C "${{ env.DERIVED_DATA_PATH }}/Build/Products"

      - name: Run tests (${{ matrix.shard }})
        run: |
          only_testing_flags=()
          for target in ${{ matrix.only_testing }}; do
            only_testing_flags+=("-only-testing:$target")
          done

          parallel_flags=()
          if [ "${{ matrix.parallel }}" = "true" ]; then
            # Each UI shard's classes run concurrently across simulator
            # clones. GitHub's macos-26 runner has only 3 vCPUs
            # (docs.github.com/en/actions/reference/runners/github-hosted-runners),
            # and #49 already proved this project's tests can flake under
            # CPU contention on this exact runner tier: wall-clock-sensitive
            # assertions inflated past their tolerance once enough ran at
            # once concurrently. Requesting 2 concurrent simulator
            # destinations, not 3, deliberately leaves a core of headroom
            # for xcodebuild/simctl overhead instead of saturating every
            # vCPU with simulator clones and reintroducing that flakiness
            # class here.
            parallel_flags+=(
              "-parallel-testing-enabled" "YES"
              "-maximum-concurrent-test-simulator-destinations" "2"
            )
          fi

          xcodebuild test-without-building \
            -xctestrun "${{ env.DERIVED_DATA_PATH }}/Build/Products/${{ needs.build-for-testing.outputs.xctestrun }}" \
            -destination "${{ env.SIMULATOR_DESTINATION }}" \
            -resultBundlePath "${{ matrix.shard }}.xcresult" \
            "${only_testing_flags[@]}" \
            "${parallel_flags[@]}"

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.shard }}
          path: ${{ matrix.shard }}.xcresult
          retention-days: 5
